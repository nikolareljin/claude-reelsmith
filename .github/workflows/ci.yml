name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: claude-reelsmith-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version matrix runs locally rather than through ci-helpers.
  #
  # ci-helpers' reusable ci.yml declares
  #   concurrency: ci-helpers-ci-${{ github.workflow }}-${{ github.ref }}
  #                cancel-in-progress: true
  # Both expressions resolve against the *caller*, so every leg of a matrix
  # lands in one concurrency group and the legs cancel each other — only the
  # last-started survives. Calling it once (see `standard` below) is fine;
  # calling it from a matrix is not.
  test:
    name: python ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      # The suite renders real video rather than mocking the encoder, so the
      # media stack is a hard requirement.
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Confirm the media stack is usable
        run: reelsmith doctor

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Byte-compile
        run: python -m compileall -q src

  # One call to the house-standard preset, for parity with the other plugins
  # in this marketplace. Not a matrix, for the reason documented above.
  standard:
    uses: nikolareljin/ci-helpers/.github/workflows/python.yml@production
    with:
      python_version: "3.12"
      lint_command: "pip install -e '.[dev]' && ruff check src tests"
      test_command: "sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core && pip install -e '.[dev]' && pytest -q"

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install each artifact into a clean venv and run the console script
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            echo "::group::$artifact"
            rm -rf /tmp/venv
            python -m venv /tmp/venv
            /tmp/venv/bin/pip install --quiet "$artifact"
            /tmp/venv/bin/reelsmith --version
            /tmp/venv/bin/reelsmith profiles --json > /dev/null
            echo "::endgroup::"
          done

      - name: Confirm the skill resources ship inside the wheel
        run: |
          rm -rf /tmp/venv
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import pathlib, claude_reelsmith
          root = pathlib.Path(claude_reelsmith.__file__).parent / "resources" / "reelsmith"
          assert (root / "SKILL.md").is_file(), "SKILL.md missing from the wheel"
          assert (root / "references" / "analysis.md").is_file(), "references missing from the wheel"
          print("skill resources present")
          PY
